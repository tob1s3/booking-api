name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Линтер и SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (стиль и типичные ошибки)
        run: |
          ruff check .
          ruff format --check .
      - name: Bandit (поиск уязвимостей в коде)
        run: bandit -c pyproject.toml -r app
      - name: pip-audit (известные уязвимости в зависимостях)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  test:
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/booking_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Миграции применяются и совпадают с моделями
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Pytest
        run: pytest -v

  docker:
    name: Сборка и сканирование образа
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - name: Сборка образа
        run: docker build -t booking-api:${{ github.sha }} .
      - name: Trivy (уязвимости в образе)
        # Сторонний action закреплён по SHA коммита: тег можно перезаписать, коммит — нет
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: booking-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
